<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BconHubs — Roblox Gaming Hub</title>
  <meta name="description" content="All my Roblox links in one place. Pick a game and jump in." />
  <meta name="theme-color" content="#050505" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --bg-card: #0c0c0c;
      --bg-card-hover: #121212;
      --orange: #FF6A00;
      --orange-glow: rgba(255, 106, 0, 0.45);
      --orange-soft: rgba(255, 106, 0, 0.15);
      --purple: #1a0a2e;
      --purple-deep: #0d0618;
      --text: #ffffff;
      --text-muted: #9a9a9a;
      --text-dim: #666666;
      --border: rgba(255, 106, 0, 0.25);
      --border-strong: rgba(255, 106, 0, 0.55);
      --radius: 16px;
      --radius-sm: 12px;
      --radius-xs: 8px;
      --shadow-glow: 0 0 30px rgba(255, 106, 0, 0.2);
      --font: "Space Grotesk", "Inter", system-ui, -apple-system, sans-serif;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Particles background */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: var(--orange);
      border-radius: 50%;
      opacity: 0.35;
      animation: float-up linear infinite;
    }

    @keyframes float-up {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.25; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* App shell */
    .app {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px 100px;
      min-height: 100dvh;
    }

    /* ===== HERO ===== */
    .hero {
      text-align: center;
      padding: 32px 0 28px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.7s ease forwards 0.1s;
    }

    .logo-wrap {
      position: relative;
      display: inline-flex;
      margin-bottom: 20px;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
      border: 1.5px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
      box-shadow: 0 0 40px var(--orange-glow), inset 0 0 20px rgba(255, 106, 0, 0.08);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 16px;
    }

    .logo-glow {
      position: absolute;
      inset: -12px;
      border-radius: 28px;
      background: radial-gradient(circle, var(--orange-glow) 0%, transparent 70%);
      filter: blur(12px);
      z-index: 0;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .site-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.8px;
      margin-bottom: 10px;
    }

    .site-title .hubs {
      color: var(--orange);
      text-shadow: 0 0 24px var(--orange-glow);
    }

    .site-subtitle {
      font-size: 14.5px;
      color: var(--text-muted);
      max-width: 300px;
      margin: 0 auto;
      line-height: 1.55;
    }

    .site-subtitle .highlight {
      color: var(--orange);
      font-weight: 500;
    }

    /* ===== PROFILE CARD ===== */
    .profile-card {
      background: linear-gradient(160deg, #111111 0%, #0a0a0a 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.7s ease forwards 0.25s;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .profile-card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 4px 32px rgba(255, 106, 0, 0.12);
    }

    .profile-avatar {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1e1e1e, #0f0f0f);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-avatar .fallback {
      font-size: 22px;
      font-weight: 700;
      color: var(--orange);
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--orange);
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .profile-name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-platform {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .btn-profile {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      background: transparent;
      border: 1.5px solid var(--orange);
      border-radius: 999px;
      color: var(--orange);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      text-decoration: none;
      flex-shrink: 0;
    }

    .btn-profile:hover:not(:disabled),
    .btn-profile:focus-visible:not(:disabled) {
      background: var(--orange);
      color: #000;
      box-shadow: 0 0 20px var(--orange-glow);
      outline: none;
    }

    .btn-profile:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--text-dim);
      color: var(--text-dim);
    }

    /* ===== SECTION HEADER ===== */
    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp 0.6s ease forwards 0.35s;
    }

    .section-header span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .section-header::before,
    .section-header::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 106, 0, 0.2), transparent);
    }

    /* ===== GAMES LIST ===== */
    .games-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .game-card {
      background: linear-gradient(160deg, #111111 0%, #0a0a0a 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all var(--transition);
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.55s ease forwards;
      position: relative;
      overflow: hidden;
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 50%, rgba(255, 106, 0, 0.06), transparent 60%);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .game-card:hover,
    .game-card:focus-visible {
      border-color: var(--border-strong);
      background: linear-gradient(160deg, #151515 0%, #0c0c0c 100%);
      box-shadow: 0 0 28px rgba(255, 106, 0, 0.12);
      outline: none;
    }

    .game-card:hover::before,
    .game-card:focus-visible::before {
      opacity: 1;
    }

    .game-thumb {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-xs);
      background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
      border: 1px solid rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .game-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-thumb .fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--orange);
      background: linear-gradient(135deg, #1f1208, #0d0a06);
    }

    .game-info {
      flex: 1;
      min-width: 0;
    }

    .game-number {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.4px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .game-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .game-play {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--orange);
      margin-top: 3px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: gap var(--transition);
    }

    .game-card:hover .game-play {
      gap: 7px;
    }

    .game-external {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      flex-shrink: 0;
      transition: all var(--transition);
      cursor: pointer;
    }

    .game-external:hover,
    .game-external:focus-visible {
      background: var(--orange-soft);
      border-color: var(--border-strong);
      color: var(--orange);
      outline: none;
    }

    .game-external svg {
      width: 16px;
      height: 16px;
    }

    /* ===== PROMO BANNER ===== */
    .promo-banner {
      margin-top: 28px;
      border-radius: var(--radius);
      border: 1.5px solid var(--border-strong);
      overflow: hidden;
      position: relative;
      min-height: 180px;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.6s ease forwards 0.7s;
      cursor: pointer;
      transition: box-shadow var(--transition), border-color var(--transition);
    }

    .promo-banner:hover {
      box-shadow: 0 0 40px rgba(255, 106, 0, 0.2);
      border-color: var(--orange);
    }

    .promo-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--purple-deep) 0%, #12081f 40%, #0a0510 100%);
      z-index: 0;
    }

    .promo-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.35;
    }

    .promo-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(5, 5, 5, 0.2) 0%, rgba(5, 5, 5, 0.75) 100%);
      z-index: 1;
    }

    .promo-hearts {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .promo-hearts span {
      position: absolute;
      font-size: 14px;
      opacity: 0.25;
      animation: float-heart 6s ease-in-out infinite;
    }

    @keyframes float-heart {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.2; }
      50% { transform: translateY(-12px) scale(1.1); opacity: 0.4; }
    }

    .promo-content {
      position: relative;
      z-index: 2;
      padding: 28px 22px;
      text-align: center;
    }

    .promo-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .promo-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: var(--orange);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .btn-promo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: var(--orange);
      color: #000;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: 0 0 24px var(--orange-glow);
      letter-spacing: 0.3px;
    }

    .btn-promo:hover:not(:disabled),
    .btn-promo:focus-visible:not(:disabled) {
      transform: scale(1.04);
      box-shadow: 0 0 36px var(--orange-glow);
      outline: none;
    }

    .btn-promo:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ===== FOOTER ===== */
    .footer {
      text-align: center;
      padding: 32px 0 16px;
      font-size: 13px;
      color: var(--text-dim);
      opacity: 0;
      animation: fadeUp 0.5s ease forwards 0.85s;
    }

    .footer .heart {
      color: var(--orange);
      text-shadow: 0 0 10px var(--orange-glow);
    }

    /* ===== SERVER LIST VIEW ===== */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    .servers-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeUp 0.45s ease forwards;
    }

    .btn-back {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .btn-back:hover,
    .btn-back:focus-visible {
      background: var(--orange-soft);
      border-color: var(--border-strong);
      color: var(--orange);
      outline: none;
    }

    .btn-back svg {
      width: 20px;
      height: 20px;
    }

    .servers-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .servers-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .servers-game-title {
      font-size: 17px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .servers-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .server-card {
      background: linear-gradient(160deg, #111111 0%, #0a0a0a 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all var(--transition);
      opacity: 0;
      transform: translateY(14px);
      animation: fadeUp 0.5s ease forwards;
    }

    .server-card:hover {
      border-color: var(--border-strong);
      box-shadow: 0 0 24px rgba(255, 106, 0, 0.1);
    }

    .server-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .server-thumb {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
      flex-shrink: 0;
    }

    .server-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .server-thumb .fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--orange);
      background: linear-gradient(135deg, #1f1208, #0d0a06);
    }

    .server-meta {
      flex: 1;
      min-width: 0;
    }

    .server-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .server-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .server-region {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .btn-join {
      width: 100%;
      padding: 13px;
      background: var(--orange);
      color: #000;
      font-family: var(--font);
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }

    .btn-join:hover:not(:disabled),
    .btn-join:focus-visible:not(:disabled) {
      box-shadow: 0 0 28px var(--orange-glow);
      transform: translateY(-1px);
      outline: none;
    }

    .btn-join:disabled {
      background: #333;
      color: var(--text-dim);
      cursor: not-allowed;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: linear-gradient(160deg, #111111 0%, #0a0a0a 100%);
      border: 1px dashed rgba(255, 106, 0, 0.2);
      border-radius: var(--radius);
      opacity: 0;
      animation: fadeUp 0.5s ease forwards;
    }

    .empty-icon {
      font-size: 36px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .empty-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    /* ===== LOADING OVERLAY ===== */
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(5, 5, 5, 0.97);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 24px;
    }

    .loading-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .loading-rings {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 28px;
    }

    .loading-rings .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--orange);
      animation: spin 1.1s linear infinite;
    }

    .loading-rings .ring:nth-child(2) {
      inset: 10px;
      border-top-color: rgba(255, 106, 0, 0.5);
      animation-duration: 1.4s;
      animation-direction: reverse;
    }

    .loading-rings .ring:nth-child(3) {
      inset: 20px;
      border-top-color: rgba(255, 106, 0, 0.25);
      animation-duration: 1.8s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-logo {
      position: absolute;
      inset: 28px;
      border-radius: 14px;
      background: linear-gradient(145deg, #1a1a1a, #0a0a0a);
      border: 1px solid var(--border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      box-shadow: 0 0 20px var(--orange-glow);
    }

    .loading-thumb {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      background: #111;
    }

    .loading-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .loading-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
      max-width: 280px;
    }

    .loading-msg {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
      min-height: 20px;
      text-align: center;
    }

    .progress-track {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--orange), #ff9a4a);
      border-radius: 99px;
      box-shadow: 0 0 12px var(--orange-glow);
      transition: width 0.1s linear;
    }

    .btn-cancel {
      padding: 10px 22px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: var(--text-muted);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;

        const u = new URL(str);
        return u.protocol === "https:" || u.protocol === "http:" || u.protocol === "roblox:";
      } catch {
        return false;
      }
    }

    function createFallback(text, size = 56) {
      const div = document.createElement("div");
      div.className = "fallback";
      div.textContent = text ? text.charAt(0).toUpperCase() : "?";
      return div;
    }

    function setImageOrFallback(container, url, fallbackText) {
      container.innerHTML = "";
      if (isPlaceholder(url)) {
        container.appendChild(createFallback(fallbackText));
        return;
      }
      const img = document.createElement("img");
      img.alt = fallbackText || "";
      img.loading = "lazy";
      img.src = url;
      img.onerror = () => {
        container.innerHTML = "";
        container.appendChild(createFallback(fallbackText));
      };
      container.appendChild(img);
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove("show"), 3200);
    }

    // ---------- Particles ----------
    function initParticles() {
      const container = document.getElementById("particles");
      const count = window.innerWidth < 500 ? 18 : 28;
      for (let i = 0; i < count; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (8 + Math.random() * 14) + "s";
        p.style.animationDelay = (Math.random() * 10) + "s";
        p.style.width = p.style.height = (1 + Math.random() * 2.5) + "px";
        p.style.opacity = 0.15 + Math.random() * 0.3;
        container.appendChild(p);
      }
    }

    // ---------- Promo hearts ----------
    function initHearts() {
      const container = document.getElementById("promo-hearts");
      const positions = [
        { top: "12%", left: "8%" }, { top: "20%", left: "85%" },
        { top: "55%", left: "12%" }, { top: "70%", left: "78%" },
        { top: "35%", left: "92%" }, { top: "80%", left: "25%" },
        { top: "15%", left: "55%" }, { top: "60%", left: "45%" }
      ];
      positions.forEach((pos, i) => {
        const s = document.createElement("span");
        s.textContent = "💜";
        s.style.top = pos.top;
        s.style.left = pos.left;
        s.style.animationDelay = (i * 0.7) + "s";
        container.appendChild(s);
      });
    }

    // ---------- Render Games ----------
    function renderGames() {
      const list = document.getElementById("games-list");
      list.innerHTML = "";

      GAMES.forEach((game, index) => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.setAttribute("role", "listitem");
        card.setAttribute("tabindex", "0");
        card.style.animationDelay = (0.4 + index * 0.07) + "s";
        card.dataset.gameId = game.id;

        const thumb = document.createElement("div");
        thumb.className = "game-thumb";
        setImageOrFallback(thumb, game.image, game.title);

        const info = document.createElement("div");
        info.className = "game-info";
        info.innerHTML = `
          <div class="game-number">GAME ${String(game.id).padStart(2, "0")}</div>
          <div class="game-title">${escapeHtml(game.title)}</div>
          <div class="game-play">Play Now →</div>
        `;

        const extBtn = document.createElement("button");
        extBtn.className = "game-external";
        extBtn.type = "button";
        extBtn.setAttribute("aria-label", "Open game link directly");
        extBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        `;

        extBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          openGameDirect(game);
        });

        card.appendChild(thumb);
        card.appendChild(info);
        card.appendChild(extBtn);

        card.addEventListener("click", () => openGame(game));
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openGame(game);
          }
        });

        list.appendChild(card);
      });
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    // ---------- Game / Server navigation ----------
    let currentGame = null;
    let loadingTimer = null;
    let progressTimer = null;
    let msgTimer = null;
    let cancelled = false;

    function openGame(game) {
      currentGame = game;
      const hasServers = Array.isArray(game.servers) && game.servers.length > 0;

      if (hasServers) {
        showServersView(game);
      } else {
        // No servers → try direct game link with loading
        startLoading(game.title, game.image, game.url, "game");
      }
    }

    function openGameDirect(game) {
      if (!isValidUrl(game.url)) {
        showToast("Link not added yet.");
        return;
      }
      startLoading(game.title, game.image, game.url, "game");
    }

    function showServersView(game) {
      document.getElementById("view-main").classList.remove("active");
      document.getElementById("view-servers").classList.add("active");
      document.getElementById("servers-game-title").textContent = game.title;

      const list = document.getElementById("servers-list");
      list.innerHTML = "";

      if (!game.servers || game.servers.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🎮</div>
            <div class="empty-title">No servers added yet</div>
            <div class="empty-desc">Servers for this game haven't been configured.</div>
            <button class="btn-back" style="margin:0 auto;width:auto;padding:10px 20px;" onclick="showMainView()">← Back to Games</button>
          </div>
        `;
        return;
      }

      game.servers.forEach((server, i) => {
        const card = document.createElement("div");
        card.className = "server-card";
        card.style.animationDelay = (0.1 + i * 0.08) + "s";

        const top = document.createElement("div");
        top.className = "server-top";

        const thumb = document.createElement("div");
        thumb.className = "server-thumb";
        setImageOrFallback(thumb, server.image || game.image, server.name);

        const meta = document.createElement("div");
        meta.className = "server-meta";
        meta.innerHTML = `
          <div class="server-name">${escapeHtml(server.name)}</div>
          <div class="server-desc">${escapeHtml(server.description || "")}</div>
          ${server.region ? `<div class="server-region">🌐 ${escapeHtml(server.region)}</div>` : ""}
        `;

        top.appendChild(thumb);
        top.appendChild(meta);

        const joinBtn = document.createElement("button");
        joinBtn.className = "btn-join";
        joinBtn.type = "button";

        if (isValidUrl(server.joinUrl)) {
          joinBtn.innerHTML = `JOIN SERVER →`;
          joinBtn.addEventListener("click", () => {
            startLoading(server.name, server.image || game.image, server.joinUrl, "server");
          });
        } else {
          joinBtn.disabled = true;
          joinBtn.textContent = "Link not added yet";
        }

        card.appendChild(top);
        card.appendChild(joinBtn);
        list.appendChild(card);
      });
    }

    function showMainView() {
      document.getElementById("view-servers").classList.remove("active");
      document.getElementById("view-main").classList.add("active");
      currentGame = null;
    }

    // ---------- Loading Screen ----------
    const LOADING_MESSAGES = [
      "Preparing your adventure...",
      "Loading game details...",
      "Connecting to destination...",
      "Almost there..."
    ];

    function startLoading(title, imageUrl, destinationUrl, type) {
      if (!isValidUrl(destinationUrl)) {
        showToast("Link not added yet. Please configure the URL in the code.");
        return;
      }

      cancelled = false;
      const overlay = document.getElementById("loading-overlay");
      const progressBar = document.getElementById("progress-bar");
      const msgEl = document.getElementById("loading-msg");
      const titleEl = document.getElementById("loading-title");
      const thumbEl = document.getElementById("loading-thumb");

      titleEl.textContent = title;
      progressBar.style.width = "0%";
      msgEl.textContent = LOADING_MESSAGES[0];

      // Thumbnail
      thumbEl.style.display = "block";
      thumbEl.innerHTML = "";
      if (!isPlaceholder(imageUrl)) {
        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = title;
        img.onerror = () => { thumbEl.style.display = "none"; };
        thumbEl.appendChild(img);
      } else {
        thumbEl.style.display = "none";
      }

      overlay.classList.add("active");

      const duration = WEBSITE_CONFIG.loadingDuration || 1800;
      const start = performance.now();
      let msgIndex = 0;

      // Rotate messages
      msgTimer = setInterval(() => {
        msgIndex = (msgIndex + 1) % LOADING_MESSAGES.length;
        msgEl.textContent = LOADING_MESSAGES[msgIndex];
      }, Math.max(400, duration / LOADING_MESSAGES.length));

      // Progress animation
      function tick(now) {
        if (cancelled) return;
        const elapsed = now - start;
        const pct = Math.min(100, (elapsed / duration) * 100);
        progressBar.style.width = pct + "%";

        if (pct < 100) {
          progressTimer = requestAnimationFrame(tick);
        } else {
          clearInterval(msgTimer);
          // Redirect
          setTimeout(() => {
            if (cancelled) return;
            overlay.classList.remove("active");
            try {
              window.open(destinationUrl, "_blank", "noopener,noreferrer");
            } catch (err) {
              showToast("Unable to open the link.");
            }
          }, 200);
        }
      }
      progressTimer = requestAnimationFrame(tick);
    }

    function cancelLoading() {
      cancelled = true;
      clearInterval(msgTimer);
      if (progressTimer) cancelAnimationFrame(progressTimer);
      document.getElementById("loading-overlay").classList.remove("active");
      document.getElementById("progress-bar").style.width = "0%";
    }

    // ---------- Profile & Banner ----------
    function initProfile() {
      const cfg = WEBSITE_CONFIG;

      // Logo
      const logoEl = document.getElementById("site-logo");
      const logoText = document.getElementById("logo-text");
      if (!isPlaceholder(cfg.logoImage)) {
        logoEl.innerHTML = "";
        const img = document.createElement("img");
        img.src = cfg.logoImage;
        img.alt = cfg.logoText || "BH";
        img.onerror = () => {
          logoEl.innerHTML = "";
          const span = document.createElement("span");
          span.id = "logo-text";
          span.textContent = cfg.logoText || "BH";
          logoEl.appendChild(span);
        };
        logoEl.appendChild(img);
      } else {
        logoText.textContent = cfg.logoText || "BH";
      }

      // Site name split
      const name = cfg.siteName || "BconHubs";
      if (name.toLowerCase().endsWith("hubs")) {
        document.getElementById("site-name-prefix").textContent = name.slice(0, -4);
        document.getElementById("site-name-suffix").textContent = "Hubs";
      } else {
        document.getElementById("site-name-prefix").textContent = name;
        document.getElementById("site-name-suffix").textContent = "";
      }

      // Profile
      document.getElementById("profile-username").textContent = cfg.username || "User";
      const avatar = document.getElementById("profile-avatar");
      setImageOrFallback(avatar, cfg.profileImage, cfg.username);

      const profileBtn = document.getElementById("btn-view-profile");
      if (isValidUrl(cfg.profileUrl)) {
        profileBtn.disabled = false;
        profileBtn.addEventListener("click", () => {
          startLoading(cfg.username + " Profile", cfg.profileImage, cfg.profileUrl, "profile");
        });
      } else {
        profileBtn.disabled = true;
        profileBtn.textContent = "Link not set";
      }

      // Banner
      document.getElementById("banner-title").textContent = cfg.bannerTitle || "WANT TO PLAY?";
      document.getElementById("banner-subtitle").textContent = cfg.bannerSubtitle || "CLICK TO VIEW MY PROFILE";
      const bannerBtn = document.getElementById("btn-banner");
      bannerBtn.textContent = (cfg.bannerButtonText || "VIEW NOW") + " →";

      const promoBg = document.getElementById("promo-bg");
      if (!isPlaceholder(cfg.bannerImage)) {
        const img = document.createElement("img");
        img.src = cfg.bannerImage;
        img.alt = "";
        img.onerror = () => { img.remove(); };
        promoBg.appendChild(img);
      }

      const openBanner = () => {
        if (isValidUrl(cfg.bannerUrl)) {
          startLoading(cfg.bannerTitle || "Profile", cfg.bannerImage || cfg.profileImage, cfg.bannerUrl, "banner");
        } else if (isValidUrl(cfg.profileUrl)) {
          startLoading(cfg.username + " Profile", cfg.profileImage, cfg.profileUrl, "profile");
        } else {
          showToast("Banner link not configured.");
        }
      };

      bannerBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        openBanner();
      });

      const promo = document.getElementById("promo-banner");
      promo.addEventListener("click", openBanner);
      promo.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openBanner();
        }
      });
    }

    // ---------- Accent color override ----------
    function applyTheme() {
      if (WEBSITE_CONFIG.accentColor && WEBSITE_CONFIG.accentColor.startsWith("#")) {
        document.documentElement.style.setProperty("--orange", WEBSITE_CONFIG.accentColor);
      }
    }

    // ---------- Init ----------
    document.getElementById("btn-back").addEventListener("click", showMainView);
    document.getElementById("btn-cancel").addEventListener("click", cancelLoading);

    document.addEventListener("DOMContentLoaded", () => {
      applyTheme();
      initParticles();
      initHearts();
      initProfile();
      renderGames();
    });
  </script>
</body>
</html>
